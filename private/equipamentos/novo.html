<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCore Inventory - Inserir Equipamento</title>
    <link rel="shortcut icon" href="../../assets/img/logo medcore.png" type="image/png">
    <link rel="stylesheet" href="../../assets/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/fontawesome/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/1241028.css">
</head>
<body style="font-family: 'Nunito', sans-serif; background-color: #f8fafc;">

    <nav class="navbar navbar-dark sticky-top px-4" style="background-color: #1e1b4b; height: 60px;">
        <div class="d-flex align-items-center gap-2">
            <img src="../../assets/img/logo medcore.png" alt="Logo" class="" style="height: 40px;">
            <span class="navbar-brand mb-0 h1 fw-bold">MedCore Inventory</span>
        </div>
        <div class="navbar-nav">
            <a class="nav-link text-white-50" href="../public/index.html">Sair (Logout)</a>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar vh-100 border-end p-0">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link py-3 px-4 fw-bold text-secondary" href="../dashboard/dashboard.html">
                                <i class="fa-solid fa-chart-pie"></i> &ensp; Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active py-3 px-4 fw-bold text-primary bg-light border-start border-4 border-primary" href="lista.html">
                                <i class="fa-solid fa-stethoscope"></i> &ensp; Equipamentos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-3 px-4 fw-bold text-secondary" href="../localizacoes/lista.html">
                                <i class="fa-solid fa-hospital"></i> &ensp; Localizações
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-3 px-4 fw-bold text-secondary" href="../fornecedores/lista.html">
                                <i class="fa-solid fa-truck-field"></i> &ensp; Fornecedores
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link py-3 px-4 fw-bold text-secondary" href="../documentacao/lista.html">
                                <i class="fa-solid fa-folder-open"></i> &ensp; Documentação
                            </a>
                        </li>
                        
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4">
                <div class="card shadow-sm border p-4 mx-auto my-4" style="max-width: 800px;">
                    <h2 class="fw-bold mb-3" style="color: #1e1b4b;"><i class="fa-solid fa-square-plus"></i> Inserir Novo Equipamento</h2>
                    <hr>
                    
                    <form action="#" method="post" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Código Interno de Inventário</label>
                            <input type="text" class="form-control" placeholder="Ex: #EQ-0043" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Designação do Equipamento</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Marca</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Modelo</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Número de Série</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Categoria / Grupo</label>
                            <select class="form-select">
                                <option selected>Escolha uma opção</option>
                                <option>Bloco Operatório</option>
                                <option>Cuidados Intensivos (UCIP)</option>
                                <option>Radiologia / Imagiologia</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Estado Atual</label>
                            <select class="form-select">
                                <option value="ativo">Ativo</option>
                                <option value="manutencao">Em Manutenção</option>
                                <option value="inativo">Inativo</option>
                            </select>
                        </div>

                        <!-- SECÇÃO DE GARANTIAS E CONTRATOS (INTEGRADA) -->
                        <h5 class="fw-bold mt-4 pt-2 mb-3" style="color: #1e1b4b;"><i class="fa-solid fa-file-signature"></i> Garantia e Contrato de Manutenção</h5>
                        <div class="row g-3 p-3 bg-light rounded border">
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Data de Início da Garantia</label>
                                <input type="date" class="form-control" required>
                            </div>
                            
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Data de Fim da Garantia</label>
                                <input type="date" class="form-control" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">Contrato de Manutenção?</label>
                                <select class="form-select" required>
                                    <option value="nao">Não, apenas garantia base</option>
                                    <option value="sim" selected>Sim, contrato ativo</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">Tipo de Contrato</label>
                                <select class="form-select">
                                    <option selected disabled value="">Escolha uma opção...</option>
                                    <option>Manutenção Preventiva e Corretiva (Full Risk)</option>
                                    <option>Apenas Manutenção Preventiva</option>
                                    <option>Suporte Técnico Remoto / Calibração</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">Entidade Responsável (Fornecedor)</label>
                                <select class="form-select">
                                    <option selected disabled value="">Selecione o parceiro...</option>
                                    <option>Dräger Portugal Lda.</option>
                                    <option>Empresa de Assistência Técnica Externa</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-bold">Periodicidade das Visitas</label>
                                <select class="form-select">
                                    <option selected disabled value="">Selecione o intervalo...</option>
                                    <option>Trimestral</option>
                                    <option>Semestral</option>
                                    <option>Anual</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-bold">Observações do Contrato</label>
                                <textarea class="form-control" rows="2" placeholder="Ex: Inclui substituição de kits de juntas e calibração anual pneumática."></textarea>
                            </div>
                        </div>

                        <div class="col-12 d-flex gap-2 mt-4">
                            <a href="lista.html" class="btn btn-secondary px-4"><i class="fa-solid fa-xmark"></i> Cancelar</a>
                            <button type="submit" class="btn text-white px-4" style="background-color: #1e1b4b;"><i class="fa-regular fa-floppy-disk"></i> Guardar</button>
                        </div>
                    </form>
                </div>
            </main>
            
        </div>
    </div>
    <script src="../../assets/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
